<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IMPACTO | Maratona Tech</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #03070d;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* ==============================
           FUNDO
        ============================== */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(rgba(0, 229, 255, 0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 229, 255, 0.025) 1px, transparent 1px);

            background-size: 50px 50px;

            pointer-events: none;
            z-index: -1;
        }

        /* ==============================
           TELA INICIAL
        ============================== */

        .inicio {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;
            padding: 30px;

            position: relative;

            background:
                radial-gradient(circle at center,
                    rgba(0, 229, 255, 0.12),
                    transparent 35%);
        }

        .inicio-conteudo {
            max-width: 1000px;
        }

        .marca {
            color: #00e5ff;
            font-size: 14px;
            letter-spacing: 5px;
            margin-bottom: 35px;
        }

        .inicio h1 {
            font-size: clamp(50px, 9vw, 110px);
            line-height: 0.9;
            text-transform: uppercase;
        }

        .inicio h1 span {
            color: #00e5ff;
            text-shadow: 0 0 35px rgba(0, 229, 255, 0.5);
        }

        .inicio p {
            max-width: 700px;
            margin: 35px auto;
            color: #8c9baa;
            font-size: 19px;
            line-height: 1.7;
        }

        .botao {
            border: 1px solid #00e5ff;
            background: transparent;
            color: #00e5ff;

            padding: 15px 35px;

            border-radius: 5px;

            font-weight: bold;
            letter-spacing: 2px;

            cursor: pointer;

            transition: 0.3s;
        }

        .botao:hover {
            background: #00e5ff;
            color: #03070d;
            box-shadow: 0 0 35px rgba(0, 229, 255, 0.5);
        }

        .scroll {
            position: absolute;
            bottom: 25px;
            color: #536271;
            font-size: 12px;
            letter-spacing: 3px;
        }

        /* ==============================
           CENÁRIOS
        ============================== */

        .cenarios {
            min-height: 100vh;
            padding: 100px 8%;
        }

        .cabecalho {
            max-width: 900px;
            margin-bottom: 70px;
        }

        .cabecalho small {
            color: #00e5ff;
            letter-spacing: 4px;
        }

        .cabecalho h2 {
            font-size: clamp(35px, 5vw, 65px);
            margin-top: 15px;
        }

        .cabecalho p {
            color: #8493a2;
            margin-top: 20px;
            font-size: 18px;
        }

        .cenarios-grid {
            max-width: 1100px;
            margin: auto;

            display: grid;
            grid-template-columns: repeat(5, 1fr);

            gap: 12px;
        }

        .cenario {
            min-height: 300px;

            background: #080f18;

            border: 1px solid #172838;

            padding: 25px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            cursor: pointer;

            transition: 0.4s;

            position: relative;
            overflow: hidden;
        }

        .cenario::after {
            content: "";

            position: absolute;

            width: 100%;
            height: 3px;

            background: #00e5ff;

            bottom: 0;
            left: -100%;

            transition: 0.4s;
        }

        .cenario:hover {
            transform: translateY(-12px);
            border-color: #00e5ff;
            background: #0b1825;
        }

        .cenario:hover::after {
            left: 0;
        }

        .cenario-numero {
            color: #425467;
            font-size: 12px;
        }

        .cenario-icone {
            font-size: 50px;
        }

        .cenario h3 {
            font-size: 21px;
        }

        .cenario p {
            color: #718292;
            font-size: 14px;
        }

        /* ==============================
           PAINEL
        ============================== */

        .painel {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.85);

            backdrop-filter: blur(12px);

            z-index: 100;

            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .painel-conteudo {
            max-width: 750px;
            width: 100%;

            background: #08121d;

            border: 1px solid #00e5ff;

            padding: 45px;

            position: relative;

            box-shadow:
                0 0 60px rgba(0, 229, 255, 0.15);
        }

        .painel-conteudo .numero {
            color: #00e5ff;
            letter-spacing: 3px;
        }

        .painel-conteudo h2 {
            font-size: 42px;
            margin: 15px 0;
        }

        .painel-conteudo p {
            color: #a4b0bc;
            line-height: 1.8;
            font-size: 17px;
        }

        .impacto-texto {
            margin-top: 25px;

            border-left: 3px solid #ff4057;

            padding: 15px 20px;

            background: rgba(255, 64, 87, 0.05);

            color: #ff8997;
        }

        .fechar {
            position: absolute;

            right: 20px;
            top: 20px;

            background: none;
            border: none;

            color: #718292;

            font-size: 25px;

            cursor: pointer;
        }

        /* ==============================
           EFEITO DOMINÓ
        ============================== */

        .domino {
            min-height: 100vh;

            padding: 100px 8%;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #050b12;
        }

        .domino-conteudo {
            max-width: 1100px;
            width: 100%;
        }

        .fluxo {
            margin-top: 70px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }

        .etapa {
            width: 190px;
            height: 150px;

            border: 1px solid #1c3448;

            background: #09131e;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            text-align: center;

            transition: 0.3s;
        }

        .etapa:hover {
            border-color: #00e5ff;
            transform: scale(1.05);
        }

        .etapa strong {
            color: #00e5ff;
            font-size: 20px;
            margin-bottom: 10px;
        }

        .etapa span {
            color: #718292;
        }

        .seta {
            color: #ff4057;
            font-size: 25px;
        }

        /* ==============================
           ESCOLHAS
        ============================== */

        .escolhas {
            min-height: 100vh;

            padding: 100px 8%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .escolhas-conteudo {
            max-width: 850px;
            width: 100%;
            text-align: center;
        }

        .situacao {
            margin: 45px 0 25px;

            background: #08121d;

            border: 1px solid #1c3448;

            padding: 35px;

            font-size: 22px;
        }

        .opcoes {
            display: grid;
            grid-template-columns: 1fr 1fr;

            gap: 15px;
        }

        .opcao {
            padding: 20px;

            background: #09131e;

            border: 1px solid #24394b;

            color: white;

            cursor: pointer;

            transition: 0.3s;
        }

        .opcao:hover {
            border-color: #00e5ff;
            background: #0c1d2c;
        }

        #resposta {
            min-height: 30px;
            margin-top: 25px;

            color: #00e5ff;

            font-weight: bold;
        }

        /* ==============================
           FINAL
        ============================== */

        .final {
            min-height: 80vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            padding: 30px;

            background:
                radial-gradient(circle,
                    rgba(0, 229, 255, 0.1),
                    transparent 40%);
        }

        .final h2 {
            font-size: clamp(40px, 7vw, 85px);
            max-width: 1000px;
            line-height: 1;
        }

        .final h2 span {
            color: #00e5ff;
        }

        .final p {
            max-width: 650px;

            margin: 30px auto;

            color: #8493a2;

            font-size: 18px;
            line-height: 1.7;
        }

        footer {
            border-top: 1px solid #172838;

            padding: 25px;

            text-align: center;

            color: #536271;

            font-size: 13px;
        }

        /* ==============================
           RESPONSIVO
        ============================== */

        @media (max-width: 900px) {

            .cenarios-grid {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        @media (max-width: 600px) {

            .cenarios-grid {
                grid-template-columns: 1fr;
            }

            .opcoes {
                grid-template-columns: 1fr;
            }

            .painel-conteudo {
                padding: 30px 20px;
            }

            .painel-conteudo h2 {
                font-size: 30px;
            }

            .fluxo {
                flex-direction: column;
            }

            .seta {
                transform: rotate(90deg);
            }

        }

    </style>

</head>


<body>
